<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess asset preview</title>
<style>
body{font:16px system-ui;background:#22252a;color:#eee;margin:32px auto;padding:0 20px;max-width:1100px}h1{font-size:28px}h2{margin-top:36px}section{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}figure{margin:0;min-width:0}img{width:100%;display:block;background:#dfd4bd;border-radius:8px}figure:nth-child(even) img{background:#6e7c6d}figcaption{text-align:center;font-size:12px;margin:7px 0 15px}button{padding:8px 16px;cursor:pointer}body.dark img{background:#353535}body.light img{background:#eee}@media(max-width:600px){section{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
<style>
figure{background:#dfd4bd;border-radius:8px;padding:12px 4px 0;display:flex;flex-direction:column;align-items:center;overflow:auto}figure:nth-child(even){background:#6e7c6d}img,figure:nth-child(even) img,body.dark img,body.light img{height:120px;width:auto;max-width:none;background:transparent;border-radius:0}figcaption{color:#111}body.dark figure{background:#353535}body.dark figcaption{color:#eee}body.light figure{background:#eee}@media(max-width:600px){img,figure:nth-child(even) img,body.dark img,body.light img{height:90px}}
</style>
<h1>Chess pieces</h1>
<p>180 tightly cropped sprites · equal 256px or 512px heights · fifteen styles</p>
<button onclick="document.body.className=''">Board colours</button>
<button onclick="document.body.className='dark'">Dark</button>
<button onclick="document.body.className='light'">Light</button>
<main id="gallery"></main>
<script>
const roles=['king','queen','bishop','knight','rook','pawn'];
for(const style of ["granite-3d","classic-2d","medieval-3d","sports-3d","scifi-3d","norse-3d","egypt-3d","ocean-3d","steampunk-3d","forest-3d","samurai-3d","gothic-3d","candy-3d","space-3d","arctic-3d"]){
 const title=document.createElement('h2');title.textContent=style;gallery.append(title);
 const section=document.createElement('section');gallery.append(section);
 for(const color of ['white','black'])for(const role of roles){
  const figure=document.createElement('figure');const img=new Image();
  img.src=`pieces/${style}/512/${color}-${role}.png`;img.alt=`${color} ${role}`;img.loading='lazy';
  const caption=document.createElement('figcaption');caption.textContent=img.alt;
  figure.append(img,caption);section.append(figure);
 }
}
</script>
</html>
