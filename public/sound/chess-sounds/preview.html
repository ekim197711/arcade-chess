<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess sound studio</title>
<style>
body{background:#101815;color:#f4f2e8;font:16px system-ui;margin:0;padding:40px 6vw}main{max-width:1100px;margin:auto}h1{font-size:44px;letter-spacing:-2px;margin-bottom:8px}p{color:#afbeb5;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin-top:30px}section{border:1px solid #3b4b40;border-radius:16px;padding:24px;background:#19241e}h2{margin:0;font-size:23px}button{background:#293d31;border:1px solid #4f6d58;color:#f4f2e8;padding:11px 14px;border-radius:8px;font:inherit;cursor:pointer;margin:4px}button:hover,button:focus{background:#49634f}button.playing{background:#bdde9a;color:#142315}label{display:flex;gap:16px;align-items:center;margin-top:24px}small{color:#bdd59f}#status{min-height:24px}
</style>
<main><small>56 ORIGINAL EFFECTS · 8 THEMES</small><h1>Chess sound studio</h1><p>Pick a mood. Tap an event to hear it. Each theme has the same seven filenames for easy swapping.</p><label>Volume <input id="volume" type="range" min="0" max="1" step=".01" value=".7"></label><p id="status" role="status">Ready to play.</p><div class="grid" id="themes"></div><p>Open this file directly to audition the WAVs, or serve the folder locally. No external libraries required.</p></main>
<script>
const themes=[['wooden-board','Wooden Board','Dry taps and resonant knocks.'],['crystal','Crystal','Glass bells and shimmering chimes.'],['retro-arcade','Retro Arcade','Pulse-wave bleeps and victory jingles.'],['sci-fi','Sci-Fi','Electronic sweeps and sonar pulses.'],['royal-fanfare','Royal Fanfare','Synthesized brass and ceremonial flourishes.'],['soft-minimal','Soft Minimal','Gentle rounded plucks for quiet play.'],['felt-piano','Felt Piano','Muted warm keys. Soft attacks, quiet consonant cues.'],['quiet-pebbles','Quiet Pebbles','Low rounded taps. Short, gentle, and understated.']];
const events=['move','capture','check','checkmate','promotion','en-passant','castling'];
let current=null;
for(const [id,name,description] of themes){
 const section=document.createElement('section');
 const heading=document.createElement('h2');heading.textContent=name;section.append(heading);
 const p=document.createElement('p');p.textContent=description;section.append(p);
 for(const event of events){const b=document.createElement('button');b.textContent=event.replace('-',' ');b.onclick=async()=>{
  if(current){current.pause();current.currentTime=0;}document.querySelectorAll('.playing').forEach(x=>x.classList.remove('playing'));
  const audio=new Audio(`./${id}/${event}.wav`);current=audio;audio.volume=Number(document.getElementById('volume').value);b.classList.add('playing');
  document.getElementById('status').textContent=`${name} · ${b.textContent}`;
  audio.onended=()=>b.classList.remove('playing');
  try{await audio.play()}catch(e){b.classList.remove('playing');document.getElementById('status').textContent=e.message;}
 };section.append(b);}document.getElementById('themes').append(section);
}
document.getElementById('volume').oninput=e=>{if(current)current.volume=Number(e.target.value)};
</script></html>
